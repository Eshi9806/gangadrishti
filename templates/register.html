{% extends "layout.html" %}

{% block title %}Register - Ganga Monitor{% endblock %}

{% block content %}
<h2>Register New Account</h2>
<form action="/register" method="POST">
    <label for="username">Username</label>
    <input autocomplete="off" autofocus type="text" name="username" id="username" placeholder="Choose a username" required>

    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="Create a password" required>

    <label for="confirmation">Confirm Password</label>
    <input type="password" name="confirmation" id="confirmation" placeholder="Confirm your password" required>

    <button type="submit">Register</button>
</form>

<p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
    Already have an account? <a href="{{ url_for('login') }}">Login here</a>
</p>
{% endblock %}
