<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ganga Quality & Tourism{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="logo">🌊 Ganga Drishti</div>
        <nav>
            {% if session.get('user_id') %}
                <a href="{{ url_for('upload') }}">Submit Photo</a>
                <a href="{{ url_for('index') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}" class="btn-primary">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Ganga Soil Quality & Civic Tourism Initiative</p>
    </footer>

</body>
</html>
