<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Submission - GangaDrishti</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 40px auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .gps-status { font-size: 13px; color: #e67e22; margin-top: 5px; font-weight: bold; }
        .btn { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Submit Ganga Monitoring Data</h2>
        
        <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm">
            <!-- Hidden inputs to store GPS coordinates captured by JS -->
            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <div class="form-group">
                <label for="file">Upload Photo of River / Ghat:</label>
                <input type="file" id="file" name="file" accept="image/png, image/jpeg, image/jpg" required>
            </div>

            <div class="form-group">
                <label for="soil_condition">Soil Condition / Observations:</label>
                <select id="soil_condition" name="soil_condition" required>
                    <option value="" disabled selected>Select condition</option>
                    <option value="Alluvial / Normal">Alluvial / Normal</option>
                    <option value="Silty / Sandy">Silty / Sandy</option>
                    <option value="Eroded Bank">Eroded Bank</option>
                    <option value="Clayey / Dense">Clayey / Dense</option>
                </select>
            </div>

            <div class="form-group">
                <p class="gps-status" id="gpsStatus">📍 Detecting your live GPS location...</p>
            </div>

            <button type="submit" class="btn">Submit Data</button>
        </form>
    </div>

    <script>
        // Automatically fetch browser GPS coordinates on page load
        window.addEventListener("DOMContentLoaded", () => {
            const statusEl = document.getElementById("gpsStatus");
            const latInput = document.getElementById("latitude");
            const lonInput = document.getElementById("longitude");

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latInput.value = position.coords.latitude;
                        lonInput.value = position.coords.longitude;
                        statusEl.style.color = "#27ae60";
                        statusEl.innerText = "📍 GPS Location captured successfully!";
                    },
                    (error) => {
                        console.warn("Geolocation error:", error.message);
                        // Fallback Patna coordinates if user blocks location
                        latInput.value = 25.61;
                        lonInput.value = 85.14;
                        statusEl.style.color = "#e74c3c";
                        statusEl.innerText = "⚠️ Location access denied. Defaulting to Patna region.";
                    },
                    { timeout: 10000 }
                );
            } else {
                latInput.value = 25.61;
                lonInput.value = 85.14;
                statusEl.style.color = "#e74c3c";
                statusEl.innerText = "⚠️ Geolocation not supported by your browser.";
            }
        });
    </script>
</body>
</html>
